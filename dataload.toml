# Settings for the data load. Secrets go in .env beside this file, not here.

[paths]
content = "server_content"
state = "state/run.sqlite"     # keep on a local disk, not a network share
logs = "logs"
work = "work"                  # temporary conf copies and remaining-chunk files

[tools]
ora2pg = "ora2pg"
psql = "psql"

[target]
# Safety check: must equal host:port/dbname from PG_DSN in the confs, or nothing runs.
# The confs currently say "lstpsql01.fintech.net:5900/ftxe01".
expected = ""

[order]
# Schema folders run in schema_list.txt order. List folder names here to leave them out.
exclude = []

[retry]
attempts = 3                   # per invocation, for errors that look transient
backoff_seconds = 30           # wait = backoff_seconds x attempt number
# transient_patterns = ["ORA-08177", ...]   # regexes; defaults are in dataload/config.py

# A copy that writes nothing to its logs for this long is checked: if Oracle is running no statement for
# this account and PostgreSQL is receiving nothing, the connection was lost without an error (ora2pg would
# wait forever), so the copy is stopped and retried. A slow but working query is never stopped. 0 = off.
# stall_minutes = 15            # put this line in [retry] above to change it

[recreate]
workers = 4                    # statements in parallel (foreign keys always run one at a time)

[validate]
# How a loaded table is checked against Oracle:
#   "direct"     = count(1) on both sides; a conf's WHERE filter and chunk ranges are applied, so counts are exact
#   "test_count" = ora2pg -t TEST_COUNT (slow to start: it scans Oracle's PL/SQL first; whole tables only)
#   "exit"       = no counting, trust ora2pg's output only
method = "direct"
before_counts = true           # record every table's row count and size on both sides before anything is changed
workers = 4                    # tables counted at the same time
# Tables whose counts may differ without failing the load. With "direct" this is normally empty;
# with "test_count" list the tables loaded with a WHERE filter, e.g. ["FTS.A_RETURN_DATA"].
ignore = []

[lanes]
# Off: the load steps run one at a time, as before.
# On: each lane below runs its steps one at a time, in the order listed, and the lanes run side by side.
# Names are the load steps as 'plan' shows them. "*" stands for every load step no other lane names.
# 'plan' and 'preflight' refuse a layout with an unknown name, a step in two lanes, a step in no lane,
# or one table loaded in two lanes. Drop, recreate and validation are not affected and run as before.
enabled = false
# Longest first, each large step in its own lane. lane5 runs the small steps, which end early, and then the
# smaller chunk scripts, which would otherwise wait behind A_EDI_DATA and EMAIL (steps after "*" run after it).
# Up to four chunk scripts can run at once (lanes 2-5): about PARALLEL_JOBS x 3 PostgreSQL connections each,
# so max_connections must be raised above 300 before using this layout.
lane1 = ["FTS/ora2pg_set_5.conf"]
lane2 = ["FTS/A_EDI_DATA/run_A_EDI_DATA_1.sh"]
lane3 = [
    "FTS/R_AUDIT_LOG/run_R_AUDIT_LOG.sh",
    "FTS/ora2pg_set_4.conf",
    "FTS/ora2pg_set_6.conf",
]
lane4 = ["FAST/EMAIL_TO_SEND_ARCHIVE_1/run_EMAIL_TO_SEND_ARCHIVE.sh"]
lane5 = [
    "FTS/ora2pg_set_7.conf", "FAST/ora2pg_set_1.conf", "FTS/ora2pg_set_8.conf",
    "FAST_TRACK/ora2pg_fast_track_set.conf", "SECADMIN/ora2pg_set_1.conf", "*",
    "FTS/SAC_DATA/run_SAC_DATA.sh",
    "FTS/A_EDI_SUMMASY/run_A_EDI_SUMMARY.sh",
    "FTS/A_EFT_PROCESSED/run_A_EFT_PROCESSED.sh",
]

[sequences]
# For 'python3 -m dataload.sequences check'. Extra sequence -> column links the PostgreSQL catalogue cannot see.
links = "sequence_links.txt"
check_timeout_seconds = 120    # one column's max() may take this long, then it is reported as not checked

[preflight]
perl_dbd_pg = true

[output]
heartbeat_seconds = 60         # a "still running" line this often while a step works; 0 = off
# Database errors can quote the row that failed. Emails and the HTML report get the error with such values
# replaced by ***; the full text stays in the logs and in 'status --failed' on this machine.
hide_values = true

[email]
enabled = false                # set true once .env has SMTP_LOGIN and SMTP_PASSWORD
# SendGrid: host "smtp.sendgrid.net", SMTP_LOGIN is the literal word apikey, SMTP_PASSWORD is the API key.
# Brevo:    host "smtp-relay.brevo.com", SMTP_LOGIN is the SMTP login, SMTP_PASSWORD is the SMTP key.
host = "smtp.sendgrid.net"
port = 587
from = ""                      # a sender verified with the mail provider
to = []                        # e.g. ["you@example.com"]
subject_prefix = "[dataload]"
schema_finished = true         # one mail when every load step of a schema has ended
# outbox = "outbox"            # also write every mail to this folder as a text file
